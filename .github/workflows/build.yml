name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # Latest 10.0 SDK. global.json sets the floor; the SDK in use
          # determines which runtime version gets embedded in the
          # self-contained exe, so tracking forward here is deliberate.
          dotnet-version: "10.0.x"

      - run: dotnet build FieldKit.sln --configuration Release

      # Verify the configuration that actually ships. `dotnet build` does not
      # exercise single-file packing, self-contained runtime bundling, or
      # compression — all of which have their own failure modes.
      - name: Verify release publish
        run: dotnet publish FieldKit/FieldKit.csproj --configuration Release --output publish

      - name: Confirm single-file artifact
        shell: pwsh
        run: |
          $exe = "publish/FieldKit.exe"
          if (-not (Test-Path $exe)) { throw "Expected single-file artifact at $exe" }

          # A size floor alone does not prove single-file: dropping
          # IncludeNativeLibrariesForSelfExtract still yields a ~59 MB exe but
          # scatters native DLLs beside it, which an elevated binary would then
          # resolve from its launch directory. Assert nothing else is emitted.
          $stray = Get-ChildItem publish -File |
                   Where-Object { $_.Name -ne 'FieldKit.exe' -and $_.Extension -ne '.pdb' }
          if ($stray) { throw "Not single-file - loose files present: $($stray.Name -join ', ')" }

          $sizeMb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "FieldKit.exe = $sizeMb MB"
          if ($sizeMb -lt 40) { throw "Artifact is $sizeMb MB - self-contained runtime looks missing" }
          if ($sizeMb -gt 100) { throw "Artifact is $sizeMb MB - compression looks disabled" }

      # Retain it: without this the artifact that just passed verification is
      # destroyed with the runner, so a failed assertion leaves nothing to
      # inspect and the exe is never smoke-tested off the author's machine.
      - uses: actions/upload-artifact@v7
        with:
          name: FieldKit-exe
          path: publish/FieldKit.exe
          if-no-files-found: error
