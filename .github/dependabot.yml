version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/FieldKit"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # These two version with the .NET runtime. The app targets .NET 10 (LTS) and
    # embeds that runtime, so take 10.0.x patches and skip the next major.
    ignore:
      - dependency-name: "System.Management"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.ServiceProcess.ServiceController"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "nuget"
    directory: "/FieldKit.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The workflows pin actions by major tag; without this ecosystem those pins
  # get no update PRs and drift silently.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
